version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: fg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: fg-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_DB: fraud_analytics
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  fraud-engine:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    container_name: fg-engine
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - IPQUALITYSCORE_KEY=${IPQUALITYSCORE_KEY}
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY}
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./data/GeoIP2-City.mmdb:/app/GeoIP2-City.mmdb:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  ml-inference:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fg-ml
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - MODEL_DIR=/app/models
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Optional: Grafana for monitoring
  grafana:
    image: grafana/grafana:10.4.0
    container_name: fg-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse

volumes:
  redis_data:
  clickhouse_data:
  grafana_data:
